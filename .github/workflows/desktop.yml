# Desktop app installers for Windows, macOS and Linux.
#
# Two ways to run:
# - Tag v* (e.g. git tag v0.0.1 && git push origin v0.0.1): builds the three
#   installers and publishes them in a GitHub Release with the same name —
#   that is where the installed apps' electron-updater downloads the update.
# - By hand (Actions → Desktop app → Run workflow): enter the version (e.g.
#   0.0.1) and, optionally, a single system. The installers stay in the run's
#   artifacts, without publishing a release.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without the v), e.g. 0.0.1"
        required: true
        default: "0.0.1"
      system:
        description: "Which installer to build"
        type: choice
        default: all
        options: [all, windows, macos, linux]

permissions:
  contents: write

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.list.outputs.systems }}
      version: ${{ steps.list.outputs.version }}
    steps:
      - id: list
        shell: bash
        run: |
          case "${{ github.event.inputs.system || 'all' }}" in
            windows) s='["windows-latest"]' ;;
            macos)   s='["macos-latest"]' ;;
            linux)   s='["ubuntu-latest"]' ;;
            *)       s='["windows-latest","macos-latest","ubuntu-latest"]' ;;
          esac
          echo "systems=$s" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  installers:
    needs: choose
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.choose.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Desktop app dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Installer version (${{ needs.choose.outputs.version }})
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.choose.outputs.version }}"

      - name: Server, engine and uv
        working-directory: desktop
        # the bicycle fine-tune (runs/ft_blur/weights/best.pt) is in git;
        # yolov8n.pt comes from the Ultralytics site
        run: npm run resources

      - name: Installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no signing certificate for now (Windows/macOS warn on the first start)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ needs.choose.outputs.version }}-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
