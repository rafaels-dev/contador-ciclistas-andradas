# Traffic Counter installers (npm run dist:win | dist:mac | dist:linux).
# Like Spotify: installs per user, without asking for administrator, opens at
# the end and updates itself from the GitHub Releases (electron-updater).
# appId and the package name stay as in 0.0.7 (contador-trafego): changing
# them would make the update install a second app instead of replacing this one.
appId: br.com.contadortrafego.app
productName: Traffic Counter
copyright: Copyright © 2026 Rafael Schettino
directories:
  output: dist
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - package.json
  - build/icon.png
extraResources:
  - from: resources/web
    to: web
  # electron-builder excludes node_modules by default — the server needs it
  - from: resources/web/node_modules
    to: web/node_modules
    filter: ["**/*"]
  - from: resources/engine
    to: engine
  - from: resources/bin
    to: bin
asar: true

win:
  target: nsis
  artifactName: TrafficCounter-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  shortcutName: Traffic Counter
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.video
  # ad-hoc signature: without an Apple certificate, an M-chip Mac requires at
  # least this to open (the user still confirms in Settings → Privacy)
  identity: "-"
  artifactName: TrafficCounter-${version}-${arch}.${ext}

linux:
  target: [AppImage, deb]
  category: AudioVideo
  syncDesktopName: true
  maintainer: Rafael Schettino <rcschettino@gmail.com>
  artifactName: TrafficCounter-${version}-${arch}.${ext}

publish:
  provider: github
  owner: rafaels-dev
  repo: contador-ciclistas-andradas
  releaseType: release
